<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanban</title>
  <script src="../../_kit/ducky.js"></script>
  <link rel="stylesheet" href="kanban.css">
</head>
<body>
  <header class="kb-head">
    <button class="kb-switch" id="open-picker" title="Switch board">
      <span class="kb-mark" id="board-mark">K</span>
      <span class="kb-title" id="board-name">Kanban</span>
      <span class="kb-scope"><span class="kb-dot"></span><span id="scope-label">Local</span></span>
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6l4 4 4-4"/></svg>
    </button>
    <span class="kb-spacer"></span>
    <label class="kb-search">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
      <input id="q" placeholder="Search cards" aria-label="Search cards">
    </label>
    <div style="position:relative">
      <button class="kb-tool" id="filter-btn" aria-haspopup="true">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 4h11M4.5 8h7M6.5 12h3"/></svg>Filter<span class="kb-count hidden" id="filter-count"></span>
      </button>
      <div class="kb-drop hidden" id="filter-drop" style="width:320px"></div>
    </div>
    <div style="position:relative">
      <button class="kb-tool" id="activity-btn" title="Activity" aria-label="Activity">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1.5 8h3l2-5 3 10 2-5h3"/></svg><span class="kb-count hidden" id="activity-count"></span>
      </button>
      <div class="kb-drop hidden" id="activity-drop" style="width:380px;max-height:70vh;overflow-y:auto;gap:2px;padding:6px"></div>
    </div>
    <button class="kb-tool" id="settings-btn" title="Board settings" aria-label="Board settings">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>
    </button>
  </header>
  <main class="kb-main" id="main"><div class="dk-loading">Loading boards…</div></main>
  <div id="modal"></div>
  <div id="toast"></div>
  <input type="file" id="file-input" multiple class="hidden">
  <script src="kanban.js"></script>
</body>
</html>
